[package]
name = "engine"
version = "0.1.0"
edition = "2021"
description = "Native Pandora playback engine: protocol + audio, sequenced into a radio"
authors = ["Cameron Tacklind <cameron@tacklind.com>"]
license = "MIT"

[dependencies]
pandora = { path = "../pandora" }
audio = { path = "../audio" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Windows Credential Manager, so the password is encrypted per-user by the OS rather than
# sitting in a dotfile next to the binary.
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
