[package]
name = "pandora"
version = "0.1.0"
edition = "2021"
description = "A reimplementation of Pandora's client protocol"
authors = ["Cameron Tacklind <cameron@tacklind.com>"]
license = "MIT"

[dependencies]
blowfish = "0.9"
cipher = "0.4"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
