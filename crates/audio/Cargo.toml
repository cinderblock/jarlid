[package]
name = "audio"
version = "0.1.0"
edition = "2021"
description = "HE-AAC decoding for the native Pandora client, via Windows Media Foundation"
authors = ["Cameron Tacklind <cameron@tacklind.com>"]
license = "MIT"

[dependencies]
thiserror = "2"
cpal = "0.16"
# Lock-free single-producer/single-consumer queue. The audio callback must never block or wait on
# a lock: a stalled callback outputs silence, which is audible as a click.
rtrb = "0.3"

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    # `IMFSourceReader::SetCurrentPosition` takes a PROPVARIANT, and windows-rs only generates it
    # when both of these are on — without them the vtable slot is a `usize` and the seek method
    # simply does not exist. Seeking is what lets a stalled stream resume where it left off.
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

# The decode probe lives in examples/ rather than src/bin/ so that fetching a real stream to test
# against does not drag reqwest, tokio and the protocol crate into the library's own dependencies.
[dev-dependencies]
pandora = { path = "../pandora" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
