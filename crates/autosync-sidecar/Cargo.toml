[package]
name = "autosync-sidecar"
version = "0.1.0"
edition = "2021"
description = "Jarlid's downloadable speech sidecar: timed words from audio, over a JSON-lines pipe"
authors = ["Cameron Tacklind <cameron@tacklind.com>"]
license = "MIT"

# The speech engine (whisper.cpp's Parakeet runtime and ggml) is loaded from DLLs at run time rather
# than linked, so this crate builds and tests with no C++ toolchain, and the engine can be rebuilt
# (build-engine.ps1) without touching it. See plans/auto-synced-lyrics.md §5.
[[bin]]
name = "jarlid-autosync"
path = "src/main.rs"

[dependencies]
autosync = { path = "../autosync" }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
