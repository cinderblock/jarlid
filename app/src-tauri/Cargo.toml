[package]
name = "jarlid"
version = "1.5.1"
description = "Jarlid — an unofficial desktop client for Pandora"
authors = ["Cameron Tacklind <cameron@tacklind.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jarlid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Proof-of-work for LRCLIB's publish/flag tokens (see lyrics::solve_challenge).
sha2 = "0.10"
souvlaki = "0.8"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Native save dialog for the station-preferences export (used from Rust only,
# so no JS package or capability permission is needed).
tauri-plugin-dialog = "2"
# RFC3339 timestamp + date-stamped default filename for the export file.
# local-offset: the daily update check is a wall-clock time, so it needs the local zone.
time = { version = "0.3", features = ["formatting", "local-offset"] }
tokio = { version = "1", features = ["time", "sync"] }
if-addrs = "0.13"
socket2 = "0.5"
# The native Pandora client: protocol, audio and playback. Replaces the engine webview.
engine = { path = "../../crates/engine" }
pandora = { path = "../../crates/pandora" }
tauri-plugin-single-instance = "2.4.3"

# The LRCLIB publish token costs ~2^24 SHA-256 hashes. Unoptimised that is minutes
# rather than seconds, which would make publishing unusable in a `tauri dev` build.
[profile.dev.package.sha2]
opt-level = 3

[target."cfg(windows)".dependencies]
resvg = { version = "0.45", default-features = false }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_Registry"] }

